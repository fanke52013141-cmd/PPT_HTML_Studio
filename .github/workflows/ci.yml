name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    name: Basic static checks
    # Production rendering pins Windows Microsoft YaHei fonts.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/remotion/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install locked HTML and editor dependencies
        run: |
          npm ci --prefix html_engine
          npm ci --prefix editor_ui
          npm ci --prefix scripts/remotion

      - name: Install rendering browser
        working-directory: html_engine
        run: npx playwright install chromium

      - name: Verify production media and font prerequisites
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            $env:PATH += ';C:\ProgramData\chocolatey\bin'
          }
          ffmpeg -version
          ffprobe -version
          foreach ($font in @('msyh.ttc', 'msyhbd.ttc', 'msyhl.ttc')) {
            if (-not (Test-Path (Join-Path "$env:WINDIR\Fonts" $font))) {
              throw "Production font missing: $font; install the licensed Windows Chinese font capability."
            }
          }

      - name: Verify editor build closure
        run: npm test --prefix editor_ui

      - name: Run canonical full checks
        run: python scripts/run_checks.py --level full

      - name: Check Remotion TypeScript
        working-directory: scripts/remotion
        run: |
          npx tsc --noEmit -p tsconfig.json
