<h2>横线 — “Online”(6 个字框)</h2><div class="row"><div class="panel"><span class="tag new">新版:手写模板+笔宽曲线(完成)</span><div class="frame" style="position:relative" data-ev='{"annotation_id": "x", "start_sec": 0, "draw_end_sec": 1, "hold_end_sec": 1, "exit_end_sec": 1, "style": {"color": "#F46A38", "opacity": 0.85, "width": 5}, "strokes": [{"kind": "path", "points": [[122.0, 606.0], [126.25, 606.07], [130.5, 606.14], [134.75, 606.22], [139.0, 606.3], [143.25, 606.39], [147.5, 606.47], [151.75, 606.56], [156.0, 606.65], [160.25, 606.74], [164.5, 606.83], [168.75, 606.92], [173.0, 607.01], [177.25, 607.1], [181.5, 607.19], [185.75, 607.28], [190.0, 607.37], [194.25, 607.46], [198.5, 607.56], [202.75, 607.66], [207.0, 607.77], [211.25, 607.88], [215.5, 607.99], [219.75, 608.12], [224.0, 608.25]], "width_profile": [0.318, 1.009, 1.2, 1.2, 1.2, 1.162, 1.099, 1.039, 1.023, 1.016, 1.034, 1.069, 1.118, 1.172, 1.2, 1.2, 1.2, 1.162, 1.097, 1.061, 1.021, 1.016, 1.04, 0.703, 0.341], "speed_profile": [0.0703, 0.1169, 0.1518, 0.1834, 0.2151, 0.2467, 0.2784, 0.31, 0.3416, 0.3733, 0.4049, 0.4366, 0.4682, 0.4999, 0.5315, 0.5631, 0.5948, 0.6264, 0.6581, 0.6897, 0.7214, 0.7573, 0.8046, 0.8734, 1.0], "closed": false, "polygon_index": 0, "start_offset_sec": 0.0}]}' data-view="0 388 513 383"><img src="bg-3.png"></div></div></div>
<script src="annotation_playback.js"></script>
<script>
document.querySelectorAll('.frame[data-ev]').forEach(frame => {
  const ev = JSON.parse(frame.dataset.ev);
  function shapesSvg(event) {
    const shapes = AnnotationsPlayback.renderScene([event], 0.5, 30);
    return shapes.map(s => {
      if (s.kind === 'path') {
        return `<path d="${s.d}" fill="${s.closed ? '#F46A38' : 'none'}" fill-opacity="${s.closed ? 0.06 : 0}" stroke="#F46A38" stroke-width="2.6" stroke-linejoin="round"/>`;
      }
      if (s.kind === 'polyline') {
        return `<path d="${s.d}" fill="none" stroke="#F46A38" stroke-width="${s.strokeWidth}" stroke-linecap="round"/>`;
      }
      return `<rect x="${s.x}" y="${s.y}" width="${s.width}" height="${s.height}" fill="#F46A38" opacity="0.3"/>`;
    }).join('');
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', frame.dataset.view);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = shapesSvg(ev);
  frame.appendChild(svg);
  // 半程面板:行笔中段状态
  const evMid = JSON.parse(JSON.stringify(ev));
  evMid.draw_end_sec = 0.55; evMid.hold_end_sec = 0.55; evMid.exit_end_sec = 0.55;
  const svg2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg2.setAttribute('viewBox', frame.dataset.view);
  svg2.setAttribute('preserveAspectRatio', 'none');
  svg2.innerHTML = shapesSvg(evMid);
  svg2.style.cssText = 'position:relative;width:100%;display:block;margin-top:4px;border:1px dashed #fca5a5;border-radius:6px;background:#fff';
  svg2.style.height = frame.clientHeight + 'px';
  frame.parentElement.appendChild(svg2);
});
</script></body></html>
