<!doctype html>

<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;font-family:var(--font),sans-serif;color:var(--ink)}
header{height:77px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid #cfd7e1;background:#f8fafc;gap:16px}header strong{font-size:18px;display:block}header small{display:block;margin-top:5px;color:#718096;font-size:12px}
nav{display:flex;gap:5px;padding:4px;background:#e9eef5;border-radius:9px}button{font:14px var(--font),sans-serif;border:0;cursor:pointer;background:transparent;border-radius:6px;color:#52647c;padding:9px 16px}button[aria-pressed=true]{background:#fff;color:#324e74;box-shadow:0 1px 4px #a9b3c733}
.review-controls{height:47px;display:flex;gap:22px;align-items:center;padding:0 28px;font-size:13px;color:#5d718b}.review-controls label{display:flex;gap:7px;align-items:center}.review-controls input[type=range]{width:210px;accent-color:#688fc6}.review-controls [hidden]{display:none}
.viewport{margin:0 auto;position:relative;box-shadow:0 12px 32px #26374f17}.canvas{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:top left;--split:50%;overflow:hidden;background:var(--background)}
#stage{position:absolute;inset:0;background:var(--background);font-family:var(--font),sans-serif;color:var(--body)}#reference{position:absolute;inset:0;width:1600px;height:900px;object-fit:contain;display:none;pointer-events:none}.canvas[data-mode=reference] #reference{display:block}.canvas[data-mode=compare] #reference{display:block;clip-path:inset(0 calc(100% - var(--split)) 0 0)}
.divider{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:#fff;box-shadow:0 0 0 1px #54647d55;display:none;pointer-events:none}.canvas[data-mode=compare] .divider{display:block}.caption{position:absolute;bottom:24px;border:1px solid #cbd6e4;background:#ffffffdd;color:#52647c;padding:8px 13px;border-radius:8px;font-size:15px}.caption[hidden]{display:none}#reference-caption{left:28px}#html-caption{right:28px}
.visual-object{position:absolute}.heading{line-height:1.15;font-weight:700;letter-spacing:0}.gradient-text{background:linear-gradient(180deg,#405a7d 25%,#405a7d 56%,#8094aa 83%,#4a6383 100%);background-clip:text;-webkit-background-clip:text;color:transparent;width:max-content}.subtitle{line-height:1.5;white-space:nowrap}.accent{color:var(--pink)}.underline{border-bottom:4px solid #F78AAD;padding-bottom:1px}.knowledge-card{position:absolute}.number{position:absolute;left:24px;top:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:29px;color:#527196;font-weight:700;letter-spacing:1px}.card-title{position:absolute;left:103px;top:24px;font-weight:700;line-height:1.45;color:var(--ink);white-space:nowrap}.card-body{position:absolute;left:103px;top:81px;line-height:1.68;white-space:nowrap}.summary-label{display:flex;align-items:center;justify-content:center;white-space:nowrap}.illustration-shadow{position:absolute;border-radius:50%;transform:rotate(-2deg)}.hide-illustrations .illustration,.hide-illustrations .illustration-shadow{visibility:hidden}svg{overflow:visible;font-family:var(--font),sans-serif}img{user-select:none}
.raw{background:var(--background);overflow:hidden}.raw header,.raw .review-controls,.raw .caption,.raw .divider{display:none!important}.raw .viewport{margin:0;box-shadow:none}
@media(max-width:800px){header{padding:0 14px}header small{max-width:220px}button{padding:8px 10px}.review-controls{padding:0 14px;gap:12px;font-size:12px}}
</style></head>
<body>
<header><div><strong>水为什么结冰 · HTML 效果</strong><small id="status">文字、卡片、箭头与图表为代码；水杯和冰块为独立插画</small></div><nav aria-label="对照模式"><button data-mode-button="html" aria-pressed="true">实际 HTML</button><button data-mode-button="reference" aria-pressed="false">生成参考图</button><button data-mode-button="compare" aria-pressed="false">滑动对照</button></nav></header>

<main class="viewport"><div class="canvas" data-mode="html"><div id="stage" aria-label="可选择文字的实际HTML科普页面"></div><img id="reference" alt="此前模型生成的完整参考图，仅用于对照"><div class="divider"></div><div class="caption" id="reference-caption" hidden>左侧 · 生成参考</div><div class="caption" id="html-caption">右侧 · 实际 HTML</div></div></main>
