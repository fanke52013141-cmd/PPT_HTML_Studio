<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token · 真实课程验证</title><style>body{margin:0;background:#f7f8fc;color:#42566f;font-family:Microsoft YaHei}header{padding:20px 28px;background:white;border-bottom:1px solid #e8ebf0}h1{font-size:24px;margin:0 0 8px}p{line-height:1.7;margin:0}main{display:grid;grid-template-columns:260px 1fr;min-height:90vh}nav{padding:24px}button{display:block;width:100%;margin:0 0 12px;padding:16px;text-align:left;border:1px solid #dfe6ef;border-radius:12px;background:white;color:#42566f;font:inherit;cursor:pointer}button[aria-current=true]{border-color:#ec8da0;background:#fff0f2}iframe{width:100%;height:1060px;border:0}details{padding:20px 30px;background:white}pre{white-space:pre-wrap;font:inherit;line-height:1.9}a{color:#42566f}@media(max-width:850px){main{grid-template-columns:1fr}nav{display:flex;gap:8px;overflow:auto}button{min-width:180px}}</style><header><h1>大模型领域的 Token</h1><p>本版视觉审阅不通过：五页结构重复，保留为技术样例。课程将按设计图与分层组合流程重新设计。</p><p><a href="README.md">内容核对与复用记录</a> · <a href="source.md">用户原始论点</a></p></header><main><nav id="scenes"></nav><section><iframe id="player" title="课程场景预览"></iframe><details><summary>本场景完整讲稿</summary><pre id="narration"></pre></details></section></main><script src="course-data.js"></script><script>const course=window.TokenCourse;const buttons=[];course.scenes.forEach((scene,i)=>{const button=document.createElement('button');button.textContent=String(i+1).padStart(2,'0')+'  '+scene.title;button.onclick=()=>{buttons.forEach(x=>x.setAttribute('aria-current','false'));button.setAttribute('aria-current','true');document.querySelector('#player').src='../../preview/index.html?scene='+encodeURIComponent(scene.id);document.querySelector('#narration').textContent=scene.narration;};buttons.push(button);document.querySelector('#scenes').append(button);});buttons[0].click();</script></html>
