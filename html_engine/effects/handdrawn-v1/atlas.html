<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>手绘平面效果库 0.1</title><style>*{box-sizing:border-box}body{margin:0;color:#343c49;background:#fffaf0;font-family:'Microsoft YaHei',sans-serif}main{width:1600px;height:1200px;padding:45px}h1{font-size:40px;margin:0 0 10px}p{font-size:21px;line-height:1.6;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cell{height:305px;border:1px solid #dfd3bc;border-radius:16px;padding:20px;background:#fffdf7}.demo{height:185px;display:flex;justify-content:center;align-items:center}h2{font-size:24px;margin:8px 0}.desc{font-size:19px;line-height:1.5}.notes{font-size:20px;line-height:1.7}</style><main><h1>手绘科普 · CSS / SVG / Canvas 2D 效果库 v0.1</h1><p>真实组件预览 · 本轮已实现，视觉待审阅｜暖白、深色线条、黄色标签、蓝色粒子、珊瑚强调</p><div class="grid" id="grid"></div><p style="margin-top:20px">按编号选择，说明标签不进入成片。独立插画另生成。运动顺序/时间来自场景定义；此图展示代表状态。</p></main><script src="effects.js"></script><script>
const items=[['A01','paper','CSS','纸片标签','承载短词；硬偏移阴影，无玻璃材质',{text:'蒸发',width:220,height:82}],['A02','arrow','SVG','弯箭头','连接步骤；细单线，可沿路径描画',{width:400,height:150}],['A03','mark','SVG','圈注','强调概念；珊瑚单线，不遮挡文字',{text:'液态 → 气态',width:400,height:140}],['A04','sun','SVG','太阳图标','表示日照；八根光线，无脸无柔光',{width:200,height:170}],['A05','flow','Canvas 2D','上升粒子','表示过程方向；固定种子，数量为示意',{width:400,height:170,count:6}],['A06','text','CSS','文字强调','真实可编辑文字；字阶与局部强调',{text:'水变成水蒸气',accent:'水蒸气',width:410,height:90,fontSize:36,bold:true}],['A07','panel','CSS','内容容器','结构与分组；边框留白，二维揭示',{width:390,height:155}],['','notes','','运动组合','开场→动作→结论；每个阶段可准确取帧',{}]];
window.effects=[];for(const [id,type,backend,name,desc,params] of items){const cell=document.createElement('section');cell.className='cell';const demo=document.createElement('div');demo.className='demo';cell.append(demo);if(type==='notes'){demo.className='notes';demo.textContent='标签：轻弹性落位\n箭头/圈注：逐笔描画\n粒子：沿固定轨迹上升\n每种效果以统一时间控制';demo.style.whiteSpace='pre-line';}else{const fx=FlatEffects.mount(demo,type,{...params,id});fx.at(1);effects.push(fx);}const title=document.createElement('h2');title.textContent=id+'｜'+name+'｜'+backend;const d=document.createElement('div');d.className='desc';d.textContent=desc;cell.append(title,d);document.querySelector('#grid').append(cell);}window.atlasReady=document.fonts.ready;
</script></html>
