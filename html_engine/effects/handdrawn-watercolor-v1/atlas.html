<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>彩铅水彩效果图板 0.1</title><link rel="stylesheet" href="style.css"><style>body{background:#faf7ef}main{width:1600px;max-width:none;margin:0;padding:48px}.board-title{font:700 56px 'STKaiti','KaiTi','Microsoft YaHei',serif;margin:0 0 10px}.board-note{font-size:22px;color:#66768a;margin:0 0 35px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.cell{height:360px;padding:24px 32px;background:#fffdf8;border:2px solid #e1d9cb;border-radius:18px}.cell h2{font-size:27px;margin:0 0 8px}.cell p{font-size:20px;color:#66768a;margin:0}.sample{height:210px;display:flex;align-items:center;justify-content:center}.sample img{width:260px;height:190px;object-fit:contain}.summary{font-size:20px;line-height:1.6;margin-top:26px}</style><main><h1 class="board-title">彩铅水彩 · 可复用效果图板</h1><p class="board-note">代码实际渲染代表帧 · 编号 / 用途 / 后端 · v0.1.0</p><div class="grid" id="grid"></div><p class="summary">图板每次按组件版本复用。文字、箭头、图标、下划线由代码控制；复杂水彩插画作为独立透明资产。运动按场景时间求值，字幕区只属于完整场景。</p></main><svg style="position:absolute;width:0;height:0"><defs><filter id="wc-grain"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter></defs></svg><script src="components.js"></script><script>
const items=[['B01','label','SVG + HTML','水彩手绘标签','短词、知识提示；文字可改',{width:340,height:110,text:'蒸发是什么？',fontSize:42,color:'pink'}],['B02','underline','SVG','彩铅双线下划线','标题强调；可逐笔出现',{width:500,height:70,color:'yellow'}],['B03','arrow','SVG','弯箭头','解释方向；可逐笔描画',{width:320,height:170,color:'blue'}],['B04','icon','SVG','小型图标','强调或辅助；星/叶两种语义',{width:140,height:135,icon:'leaf',color:'green'}],['B05','asset','PNG','水彩插画','独立透明资产；示意静止水面',{}]];
for(const [id,type,backend,name,description,parameters] of items){const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<h2>${id} · ${name} · ${backend}</h2><p>${description}</p>`;const sample=document.createElement('div');sample.className='sample';cell.append(sample);if(type==='asset'){const img=document.createElement('img');img.src='assets/beaker-calm.png';img.alt='彩铅水彩烧杯';sample.append(img);}else{const fx=WatercolorEffects.mount(sample,type,{id,...parameters});fx.at(1);}document.getElementById('grid').append(cell);}window.atlasReady=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode())]);
</script></html>
