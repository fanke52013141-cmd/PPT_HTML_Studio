<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>效果库复用验证</title><style>*{box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;margin:24px;color:#343c49;background:#eeeae0}h1{font-size:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.sample{padding:20px;background:#fff;border-radius:12px}.demo{min-height:200px;display:flex;align-items:center;justify-content:center;overflow:visible}.name{font-size:20px;margin:12px 0}a{color:#735c43}</style><h1>同一套组件 · 两主题 / 两尺寸 / 长短文字</h1><p><a href="index.html">返回动画</a> · 这些是复用证据，不是另一套独立组件。</p><div class="grid" id="grid"></div><script src="../../effects/handdrawn-v1/effects.js"></script><script>
window.reuseEffects=[];const themes=[{}, {paper:'#f4f8ff',ink:'#344859',yellow:'#d9efde',blue:'#ab96d3',coral:'#547dc1'}];
for(let variant=0;variant<2;variant++)for(const type of FlatEffects.types){const s=document.createElement('section');s.className='sample';const n=document.createElement('div');n.className='name';n.textContent=type+' · '+(variant?'冷色大尺寸 / 长文字':'暖色小尺寸 / 短文字');s.append(n);const demo=document.createElement('div');demo.className='demo';s.append(demo);document.querySelector('#grid').append(s);const size=variant?1.25:1;const width=(type==='sun'?160:type==='mark'?320:350)*size,height=(type==='sun'?160:150)*size;const text=type==='paper'?(variant?'液态转为气态':'蒸发'):type==='mark'?(variant?'液态 → 气态':'变化'):variant?'水蒸气进入空气，形成新的解释内容':'水蒸气';const fx=FlatEffects.mount(demo,type,{id:type+'.'+variant,text,width,height,fontSize:variant?30:27,count:variant?12:6,seed:17,accent:'水蒸气'},themes[variant]);fx.at(1);reuseEffects.push(fx);}
window.reuseReady=document.fonts.ready;
</script></html>
