<!doctype html><html lang="zh"><meta charset="utf-8"><title>动态 Mask 同帧验收</title>
<style>body{font:16px system-ui;background:#eee}button,select{padding:8px;margin:4px}#player{width:960px;height:540px;overflow:hidden}#player.portrait{width:540px;height:960px}#player div[style*="background-image: linear-gradient"]{display:none!important}</style>
<select id="project" aria-label="画布比例"><option value="annotation_dynamic_landscape">横屏</option><option value="annotation_dynamic_portrait">竖屏</option></select><div id="controls"></div><div id="status"></div><div id="player"></div>
<script src="/annotation_player.bundle.js"></script><script>
let timeline;const frames=[0,134,147,183,193,202,239,252,335,345,354,446];const sel=document.getElementById('project');
async function load(){const p=sel.value;document.getElementById('status').textContent='加载中';const r=(await(await fetch(p+'-preview.json')).json()).result;const base=location.origin+'/api/projects/'+p+'/annotations/slides/slide_001';const scene=structuredClone(r.scene);scene.layers.forEach(l=>l.asset=base+'/scene-asset?asset='+encodeURIComponent(l.asset));timeline=structuredClone(r.timeline);timeline.events.forEach(e=>e.strokes.forEach((s,i)=>s.ink.frames=Array.from({length:s.ink.frame_count},(_,f)=>base+'/ink/'+timeline.build_id+'/'+e.annotation_id+'/'+i+'/'+f)));const subtitle=await(await fetch('/api/projects/'+p+'/subtitle-settings')).json();const n=document.getElementById('player');n.classList.toggle('portrait',p.endsWith('portrait'));window.AnnotationPlayer.mount(n,{subtitle_style:subtitle.subtitle_style,slides:[{slide_id:'slide_001',start_sec:0,duration_sec:timeline.slide_duration_sec,scene,audio_timeline:r.audio_timeline,animation_timeline:r.animation_timeline,audio_file:location.origin+r.audio_url,annotation_timeline:timeline}]},30,timeline.slide_duration_sec,...timeline.canvas);document.getElementById('status').textContent='已加载 '+p+' · build '+timeline.build_id}
frames.forEach(f=>{const b=document.createElement('button');b.textContent='帧 '+f;b.onclick=()=>{window.AnnotationPlayer.seek(f);document.getElementById('status').textContent='当前帧 '+f+' · '+(f/30).toFixed(3)+' 秒'};document.getElementById('controls').append(b)});sel.onchange=load;load();
</script></html>
