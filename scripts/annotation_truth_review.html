<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>勾画同步 · 独立人工标记</title>
<style>body{font:18px system-ui;max-width:950px;margin:40px auto;background:#fefdf9;color:#222}button,input,select{font:inherit;padding:10px;margin:5px}button{cursor:pointer}article{background:white;padding:24px;border-radius:16px}mark{background:#fff0df}audio{width:100%}small{display:block;color:#666}#status{color:#a74320}</style>
<h1>独立人工起点标记</h1><p>请听音，定位高亮短语第一个实际发音的起点。模型预测时间不在此页面展示。相同文字可能出现多次，请按高亮位置选择。</p>
<input id="reviewer" placeholder="姓名或编号（选填）" aria-label="姓名或编号（选填）"><small>无需填写编号，直接记录时间并保存即可。</small><select id="choice" aria-label="选择样本"></select><span id="progress"></span>
<article><h2 id="heading"></h2><p id="text"></p><audio id="audio" controls preload="metadata"></audio><canvas id="waveform" width="800" height="80" style="width:100%;height:80px;cursor:crosshair" aria-label="音频波形，可点击定位，也可用播放器和前后帧按钮"></canvas><small id="position" aria-live="polite"></small><div><button id="back">前一帧</button><button id="next">后一帧</button><button id="loop">循环当前位置前后 1 秒</button></div><label>音频起点（秒）<input id="time" type="number" min="0" step="0.001"></label><button id="mark">记录当前播放位置</button><button id="save">保存本条并进入下一条</button><p id="status"></p></article>
<p><button id="download">导出人工标记 JSON</button><button id="import">恢复标记 JSON</button><input id="file" type="file" accept="application/json" hidden></p>
<small>标记会自动保存在此浏览器。请另外导出 JSON 留存；清理浏览器数据会丢失本地记录。音频变更后，旧标记不会自动迁移。</small>
<script src="annotation_audio_calibration.js?v=20261006.2"></script>
<script>
const samples=__SAMPLES__, audio=document.getElementById('audio'), choice=document.getElementById('choice'), time=document.getElementById('time'), reviewer=document.getElementById('reviewer');
document.querySelector('h1').textContent=samples.length+' 条独立人工起点标记';
const key='annotation-truth-100-20261006'; let labels={}, looping=false, cleanup=null;
try{labels=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){document.getElementById('status').textContent='本地记录无法解析，请从导出文件恢复。'}
samples.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.sample_id+' · '+x.category+' · '+(x.audio_sha256?'音频就绪':'等待音频');choice.append(o)});
function persist(){localStorage.setItem(key,JSON.stringify(labels));document.getElementById('progress').textContent=Object.keys(labels).length+' / '+samples.length+' 已标记 · '+samples.filter(x=>x.audio_sha256).length+' 条音频就绪'}
function show(){cleanup?.();cleanup=null;looping=false;const x=samples[Number(choice.value)];document.getElementById('heading').textContent=x.sample_id+' · '+x.category;const p=document.getElementById('text');p.replaceChildren();const chars=Array.from(x.text);p.append(chars.slice(0,x.range[0]).join(''));const m=document.createElement('mark');m.textContent=chars.slice(...x.range).join('');p.append(m,chars.slice(x.range[1]).join(''));audio.src=x.audio_url||'';if(x.audio_url)cleanup=AnnotationAudioCalibration.attach({audio,canvas:document.getElementById('waveform'),status:document.getElementById('position'),initialTime:labels[x.sample_id]?.truth_audio_sha256===x.audio_sha256?labels[x.sample_id].truth_start_sec:0});const label=labels[x.sample_id];time.value=label?.truth_audio_sha256===x.audio_sha256?label.truth_start_sec:'';document.getElementById('save').disabled=!x.audio_sha256;document.getElementById('status').textContent=x.audio_sha256?'':'本条音频仍在生成，请选择已就绪样本或稍后刷新。';persist()}
choice.onchange=show;document.getElementById('waveform').addEventListener('click',()=>{looping=false});document.getElementById('back').onclick=()=>{audio.pause();looping=false;audio.currentTime=Math.max(0,audio.currentTime-1/30)};document.getElementById('next').onclick=()=>{audio.pause();looping=false;audio.currentTime=Math.min(audio.duration||0,audio.currentTime+1/30)};
let lo=0,hi=0;document.getElementById('loop').onclick=()=>{looping=!looping;if(looping){lo=Math.max(0,audio.currentTime-1);hi=Math.min(audio.duration,audio.currentTime+1);audio.currentTime=lo;audio.play()}};audio.ontimeupdate=()=>{if(looping&&audio.currentTime>=hi){audio.currentTime=lo;audio.play()}};document.getElementById('mark').onclick=()=>{audio.pause();looping=false;time.value=audio.currentTime.toFixed(3);document.getElementById('status').textContent='已记录 '+time.value+' 秒，请点击保存。'};
document.getElementById('save').onclick=()=>{const x=samples[Number(choice.value)],v=Number(time.value);if(!x.audio_sha256){document.getElementById('status').textContent='本条音频尚未就绪。';return}if(time.value===''||!Number.isFinite(v)||v<0){document.getElementById('status').textContent='请先点击“记录当前播放位置”。';return}if(!Number.isFinite(audio.duration)){document.getElementById('status').textContent='音频尚未加载完成，请等待音频时长出现后保存。';return}if(v>=audio.duration){document.getElementById('status').textContent='请定位到音频结束之前的发音起点，再记录时间。';return}labels[x.sample_id]={sample_id:x.sample_id,truth_start_sec:v,truth_audio_sha256:x.audio_sha256,truth_source:'human',reviewer:reviewer.value.trim()||'local-human-reviewer',labelled_at:new Date().toISOString()};persist();audio.pause();if(Number(choice.value)<samples.length-1){choice.value=Number(choice.value)+1;show();document.getElementById('status').textContent='上一条已保存，当前是下一条。'}else document.getElementById('status').textContent='最后一条已保存，请导出 JSON。'};
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.values(labels),null,2)],{type:'application/json'}));a.download='annotation-human-truth.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{const rows=JSON.parse(await e.target.files[0].text());const incoming={};for(const row of rows){const s=samples.find(x=>x.sample_id===row.sample_id);if(!s||row.truth_audio_sha256!==s.audio_sha256||row.truth_source!=='human'||!row.reviewer||!Number.isFinite(row.truth_start_sec)||row.truth_start_sec<0)throw Error('标记文件与当前音频不匹配');incoming[row.sample_id]=row}labels={...labels,...incoming};show()}catch(err){document.getElementById('status').textContent=err.message}};show();
</script></html>
