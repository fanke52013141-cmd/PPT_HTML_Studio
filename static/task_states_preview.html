<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PPT Studio · 简化加载预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#17191d;font:14px "Microsoft YaHei",sans-serif}header{height:64px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 24px;gap:24px}header strong{color:#ee5d36;font-size:18px}.note{color:#94a3b8;font-size:12px}main{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 64px)}nav{padding:20px 12px;background:white;border-right:1px solid #e2e8f0}button{padding:10px 14px;background:white;border:1px solid #e2e8f0;border-radius:8px;font:inherit;color:#475569;cursor:pointer}nav button{display:block;width:100%;text-align:left;margin-bottom:8px}nav button.active{background:#fff5f0;border-color:#fbd9ca;color:#ee5d36}.titlebar{height:59px;padding:0 28px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}.titlebar h1{font-size:20px;margin:0}.titlebar h1:before{content:'';display:inline-block;width:5px;height:22px;background:#ee5d36;border-radius:3px;margin-right:10px;vertical-align:middle}.tools{display:flex;gap:8px}.tools button{font-size:12px;padding:7px 12px}.page-loading{min-height:calc(100vh - 124px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#64748b}.spinner{width:26px;height:26px;border:2px solid #e2e8f0;border-top-color:#ee5d36;border-radius:50%;animation:rotate .9s linear infinite}.page-loading p{margin:0;font-size:14px}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:24px}.image-card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:12px;color:#64748b;background:#f4f5f7;padding:4px 9px;border-radius:6px}.image-card h2{font-size:15px;font-weight:600;margin:16px 0 12px}.image-area{aspect-ratio:16/9;background:#f8fafc;border-radius:8px;display:flex;align-items:center;justify-content:center}.image-area .spinner{width:24px;height:24px}.image-area p{margin:0;color:#94a3b8;font-size:13px}.ready{background:#fff9f4;color:#334155;padding:30px;display:flex;flex-direction:column;align-items:flex-start;gap:20px}.ready strong{font-size:20px}.ready span{font-size:13px;color:#64748b}.meta{color:#94a3b8;font-size:12px}.image-card button{font-size:12px;padding:6px 12px}.image-card button:disabled{color:#94a3b8;cursor:default}.view-note{padding:12px 28px;color:#94a3b8;font-size:12px}@keyframes rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:800px){main{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{width:auto}.tools{display:none}.images{grid-template-columns:1fr}}
.detail{padding:24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button:first-child{background:#ee5d36;color:white;border-color:#ee5d36}.stage{background:white;padding:22px;border-bottom:1px solid #e2e8f0}.stage h2{font-size:16px;margin:0 0 16px}.stage .field{line-height:1.8;border-bottom:1px solid #ee5d36;padding:10px 0}.local-loading{min-height:160px;display:flex;align-items:center;justify-content:center;gap:12px;color:#64748b}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:20px;color:#94a3b8;padding:14px 0;border-bottom:1px solid #e2e8f0}.audio-row{background:white;margin-bottom:16px;padding:18px;border-radius:12px}.audio-row h2{font-size:15px;margin-top:0}.audio-slot{height:48px;background:#f8fafc;display:flex;align-items:center;justify-content:center;gap:12px;color:#64748b;margin-top:16px;border-radius:24px}.static-placeholder{background:#f8fafc;height:12px;margin:20px 0;border-radius:3px;width:85%}.error-copy{color:#b45343;font-size:12px;padding-top:12px}.state-controls{display:flex;gap:8px;padding:16px 24px 0}.state-controls button{font-size:12px}.preview-stage{max-width:900px;background:white;border-radius:14px;margin:auto;padding:24px}.preview-stage .image-area{min-height:260px}.stage-title{display:flex;justify-content:space-between;margin-bottom:16px}.stage-title strong{font-size:16px}</style><body><header><strong>PPT Studio</strong><span>加载效果预览</span><span class="note">仅预览，未修改正式页面</span></header><main><nav id="nav"></nav><section><div class="titlebar"><h1 id="title"></h1><div class="tools" id="tools"></div></div><div id="view"></div></section></main><script>
const pages=[['话题生成文章','准备文章','正在生成文章…'],['生成演讲稿','分镜规划','正在生成演讲稿…'],['内容可视化','分镜规划','正在生成内容可视化…'],['图片生成','图片生成与管理',''],['AI Mask 标注','AI Mask 标注','正在标注…'],['音频生成','旁白与音频','正在生成音频…'],['数字人生成','数字人讲解','正在生成数字人视频…'],['作品输出','作品输出','正在生成视频…']];
function show(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));document.getElementById('title').textContent=pages[i][1];const tools=document.getElementById('tools');tools.innerHTML=(i===1||i===2)?'<button>演讲稿 Prompt</button><button>可视化 Prompt</button>':i===3?'<button>生图 Prompt</button><button>图片风格</button>':'';const view=document.getElementById('view');
if(i===1||i===2){view.innerHTML='<div class="detail"><div class="tabs"><button>第 1 页</button><button>第 2 页</button><button>第 3 页</button></div><div class="stage"><h2>第一步：演讲稿</h2>'+(i===1?'<div class="local-loading"><div class="spinner"></div><span>正在生成每页标题与演讲稿…</span></div><div class="static-placeholder" style="width:45%"></div><div class="static-placeholder"></div>':'<div class="field"><strong>Token 是大模型处理文本的最小单位</strong></div><div class="field">在 AI 大模型里，Token 是处理文本的最小单位，可以是一个字、一个词或标点。</div>')+'</div><div class="stage"><h2>第二步：画面与演讲片段</h2><div class="mapping"><span>画面文字</span><span>对应演讲片段</span></div>'+(i===2?'<div class="local-loading"><div class="spinner"></div><span>正在生成本页画面与演讲片段…</span></div>':'<div class="local-loading">等待演讲稿生成完成</div>')+'</div></div>';return;}
if(i===5){view.innerHTML='<div class="detail">'+['已完成','生成中','待生成'].map((state,j)=>'<article class="audio-row"><div class="card-head"><h2>第 '+(j+1)+' 页</h2><span class="status">'+state+'</span></div><div class="field">'+['先搞懂 Token 到底是什么。','一个 Token 可以是单个汉字、词组或标点。','Token 数量影响模型的计费与上下文长度。'][j]+'</div><div class="audio-slot">'+(j===1?'<div class="spinner"></div><span>正在合成此页音频…</span>':j===0?'▶　0:00 / 0:09　────────────':'暂无音频 · 等待生成')+'</div></article>').join('')+'</div>';return;}
if(i===0){view.innerHTML='<div class="detail"><div class="stage"><h2>输入话题</h2><div class="field">什么是 Token？</div></div><div class="stage"><h2>文章</h2><div class="local-loading"><div class="spinner"></div><span>正在根据话题生成文章…</span></div><div class="static-placeholder" style="width:40%"></div><div class="static-placeholder"></div><div class="static-placeholder" style="width:70%"></div></div></div>';return;}
if(i!==3){view.innerHTML='<div class="detail"><div class="preview-stage"><div class="stage-title"><strong>'+pages[i][1]+'</strong><span class="status">生成中</span></div><div class="image-area"><div class="spinner"></div></div><div class="local-loading" style="min-height:50px">'+pages[i][2]+'</div><div class="mapping"><span>'+(i===4?'当前页：第 2 页 · 关联画面元素':i===6?'整段旁白 · 数字人视频':'MP4 · 等待视频输出')+'</span><span>完成后在此显示结果</span></div></div></div>';return;}
view.innerHTML='<div class="state-controls"><button onclick="showImageRetry(false)">预览：首次失败后重试</button><button onclick="showImageRetry(true)">预览：两次失败</button></div><div class="images">'+['生成中','排队中','已生成','待生成'].map((state,j)=>'<article class="image-card"><div class="card-head"><span class="status">'+state+'</span><button '+(j<2?'disabled':'')+'>生成图片</button></div><h2><span class="meta">第 '+(j+1)+' 页</span> '+['AI 里的 Token 是文本的最小单位','一个 Token 大概有多长','Token 决定计费和上下文长度','其他场景的 Token 含义不同'][j]+'</h2><div class="image-area '+(j===2?'ready':'')+'">'+(j===0?'<div class="spinner" role="status" aria-label="图片生成中"></div>':j===2?'<strong>Token 与上下文长度</strong><span>这里展示已生成的图片（预览占位）</span>':'<p>'+(j===1?'等待生成':'暂无图片')+'</p>')+'</div></article>').join('')+'</div>';}
function showImageRetry(failed){const card=document.querySelector('.image-card');card.querySelector('.status').textContent=failed?'生成失败':'重试中';card.querySelector('.image-area').innerHTML=failed?'<p>图片未生成</p>':'<div class="spinner" aria-label="重新生成图片中"></div>';let copy=card.querySelector('.error-copy');if(!copy){copy=document.createElement('div');copy.className='error-copy';card.append(copy);}copy.textContent=failed?'两次生成均未成功。其他已生成图片保留，可再次生成本页。':'首次生成未成功，正在重新提交（第 2 次 / 共 2 次）。';const action=card.querySelector('button');action.textContent=failed?'重试此页':'生成图片';action.disabled=!failed;}
pages.forEach((page,i)=>{const b=document.createElement('button');b.textContent=page[0];b.onclick=()=>show(i);document.getElementById('nav').append(b)});show(2);
</script></body></html>
